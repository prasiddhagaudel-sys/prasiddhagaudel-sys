<svg width="180" height="50" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .btn { fill: #0d1117; stroke: #c9d1d9; stroke-width: 2; rx: 8; }
      .text { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .icon { fill: #c9d1d9; }
      
      .shine { fill: url(#shineGrad); opacity: 0; animation: pass 4s infinite 2.6s; }
      @keyframes pass {
        0% { transform: translateX(-180px) skewX(-20deg); opacity: 0.5; }
        20% { transform: translateX(250px) skewX(-20deg); opacity: 0.5; }
        100% { transform: translateX(250px) skewX(-20deg); opacity: 0; }
      }
      
      .glow-border { animation: pulse 2s infinite alternate 1.0s; }
      @keyframes pulse {
        0% { stroke: #8b949e; stroke-width: 2; filter: drop-shadow(0 0 2px #8b949e); }
        100% { stroke: #c9d1d9; stroke-width: 3; filter: drop-shadow(0 0 8px #c9d1d9); }
      }
    </style>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Button Body -->
  <rect x="3" y="3" width="174" height="44" class="btn glow-border" />
  
  <!-- GitHub Icon (24x24) -->
  <g transform="translate(18, 13)">
    <path class="icon" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="31" class="text">GitHub</text>
  
  <!-- Overlay Shine -->
  <rect x="3" y="3" width="174" height="44" rx="8" class="shine" style="pointer-events: none;" />
</svg>
