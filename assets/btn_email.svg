<svg width="180" height="50" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .btn { fill: #0d1117; stroke: #D14836; stroke-width: 2; rx: 8; }
      .text { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .icon { fill: #D14836; }
      
      .shine { fill: url(#shineGrad); opacity: 0; animation: pass 4s infinite; }
      @keyframes pass {
        0% { transform: translateX(-180px) skewX(-20deg); opacity: 0.5; }
        20% { transform: translateX(250px) skewX(-20deg); opacity: 0.5; }
        100% { transform: translateX(250px) skewX(-20deg); opacity: 0; }
      }
      
      .glow-border { animation: pulse 2s infinite alternate; }
      @keyframes pulse {
        0% { stroke: #D14836; stroke-width: 2; filter: drop-shadow(0 0 2px #D14836); }
        100% { stroke: #ea4335; stroke-width: 3; filter: drop-shadow(0 0 8px #D14836); }
      }
    </style>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Button Body -->
  <rect x="3" y="3" width="174" height="44" class="btn glow-border" />
  
  <!-- Mail Icon (24x24) -->
  <g transform="translate(18, 13)">
    <path class="icon" d="M0 3v18h24v-18h-24zm6.623 7.929l-4.623 5.712v-9.458l4.623 3.746zm-4.141-5.929h19.035l-9.517 7.713-9.518-7.713zm5.694 7.188l3.824 3.099 3.83-3.104 5.612 6.817h-18.779l5.513-6.812zm9.208-1.264l4.616-3.741v9.348l-4.616-5.607z"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="31" class="text">Email Me</text>
  
  <!-- Overlay Shine -->
  <rect x="3" y="3" width="174" height="44" rx="8" class="shine" style="pointer-events: none;" />
</svg>
