<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .cell-empty { fill: #161b22; rx: 3; ry: 3; }
      
      .b1 { fill: #39d353; rx: 3; ry: 3; opacity: 0; animation: drop1 4s ease-in forwards infinite; }
      .b2 { fill: #26a641; rx: 3; ry: 3; opacity: 0; animation: drop2 4s ease-in 0.5s forwards infinite; }
      .b3 { fill: #006d32; rx: 3; ry: 3; opacity: 0; animation: drop3 4s ease-in 1.0s forwards infinite; }
      .b4 { fill: #0e4429; rx: 3; ry: 3; opacity: 0; animation: drop4 4s ease-in 1.5s forwards infinite; }
      .b5 { fill: #39d353; rx: 3; ry: 3; opacity: 0; animation: drop5 4s ease-in 2.0s forwards infinite; }
      .b6 { fill: #26a641; rx: 3; ry: 3; opacity: 0; animation: drop6 4s ease-in 2.5s forwards infinite; }

      @keyframes drop1 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      @keyframes drop2 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      @keyframes drop3 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      @keyframes drop4 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      @keyframes drop5 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      @keyframes drop6 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 25%, 100% { transform: translateY(0); opacity: 1; } }
      
      /* A subtle glow for the text */
      .graph-text {
        font: 600 18px 'Segoe UI', Arial, sans-serif;
        fill: #c9d1d9;
      }
    </style>

    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" class="cell-empty" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <!-- Centered Grid -->
  <g transform="translate(50, 50)">
    <!-- 45 cols, 7 rows -->
    <rect width="720" height="112" fill="url(#grid)" />
    
    <!-- Tetris Blocks dropping into position -->
    <!-- Column 5 -->
    <rect x="64" y="96" width="13" height="13" class="b1" />
    <rect x="64" y="80" width="13" height="13" class="b2" />
    <!-- Column 6 -->
    <rect x="80" y="96" width="13" height="13" class="b1" />
    <!-- Column 10 -->
    <rect x="144" y="96" width="13" height="13" class="b3" />
    <rect x="144" y="80" width="13" height="13" class="b4" />
    <rect x="144" y="64" width="13" height="13" class="b3" />
    <!-- Column 11 -->
    <rect x="160" y="96" width="13" height="13" class="b4" />
    <!-- Column 20 -->
    <rect x="304" y="96" width="13" height="13" class="b5" />
    <!-- Column 30 -->
    <rect x="464" y="96" width="13" height="13" class="b6" />
    <rect x="464" y="80" width="13" height="13" class="b5" />
    <!-- Column 31 -->
    <rect x="480" y="96" width="13" height="13" class="b6" />
    <rect x="480" y="80" width="13" height="13" class="b5" />
    <rect x="480" y="64" width="13" height="13" class="b6" />
    <!-- Column 40 -->
    <rect x="624" y="96" width="13" height="13" class="b1" />
  </g>
</svg>
