<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <style>
      .text-title {
        font: bold 60px 'Segoe UI', Arial, sans-serif;
        fill: #ffffff;
        opacity: 0;
        animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .skill-text {
        font: 400 24px 'Fira Code', 'Courier New', monospace;
        fill: #58a6ff;
        opacity: 0;
      }

      /* 4 skills, 12 seconds total loop (3s per skill) */
      .skill1 { animation: cycleText 12s infinite 0s; }
      .skill2 { animation: cycleText 12s infinite 3s; }
      .skill3 { animation: cycleText 12s infinite 6s; }
      .skill4 { animation: cycleText 12s infinite 9s; }

      .typing-cursor {
        animation: blink 1s step-end infinite;
      }
      
      .highlight {
        fill: transparent;
        stroke: #58a6ff;
        stroke-width: 2;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLine 2s ease forwards 1s;
      }

      @keyframes slideUp {
        0% { transform: translateY(30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      
      @keyframes cycleText {
        0% { opacity: 0; transform: translateY(10px); }
        5% { opacity: 1; transform: translateY(0); }
        20% { opacity: 1; transform: translateY(0); }
        25% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes drawLine { 100% { stroke-dashoffset: 0; } }

      /* Floating tech shapes */
      .shape { opacity: 0.1; fill: none; stroke: #58a6ff; stroke-width: 2; }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 8s ease-in-out infinite reverse; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(10deg); }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Floating abstract geometric elements -->
  <g class="float1" transform="translate(100, 50)">
    <polygon points="25,0 50,43 0,43" class="shape" />
  </g>
  <g class="float2" transform="translate(700, 150)">
    <circle cx="20" cy="20" r="20" class="shape" />
  </g>
  <g class="float1" transform="translate(750, 40)">
    <rect x="0" y="0" width="30" height="30" class="shape" />
  </g>

  <g text-anchor="middle" transform="translate(400, 110)">
    <text x="0" y="0" class="text-title">Prasiddha Gaudel</text>
    <!-- Animated underline -->
    <path d="M-220,15 L220,15" class="highlight" />
  </g>

  <g text-anchor="middle" transform="translate(400, 170)">
    <text x="0" y="0" class="skill-text skill1">&gt; Electronics &amp; Comm. Engineering<tspan class="typing-cursor">_</tspan></text>
    <text x="0" y="0" class="skill-text skill2">&gt; Passionate Software Developer<tspan class="typing-cursor">_</tspan></text>
    <text x="0" y="0" class="skill-text skill3">&gt; AI &amp; Machine Learning<tspan class="typing-cursor">_</tspan></text>
    <text x="0" y="0" class="skill-text skill4">&gt; Robotics Enthusiast<tspan class="typing-cursor">_</tspan></text>
  </g>
</svg>
